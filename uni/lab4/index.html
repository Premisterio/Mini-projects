<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обертання Місяця навколо Землі</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Анімація обертання Місяця навколо Землі</h1>

    <div class="space">
        <div class="orbit">
            <div class="earth">
                <div class="moon-orbit">
                    <div class="moon"></div>
                </div>
            </div>
        </div>
    </div>

    <p class="info">
        Земля обертається навколо своєї осі, а Місяць обертається навколо Землі.
    </p>
</body>
</html>
